name: CI
on:
  push:
    branches: [ "ci/**" ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build (driven by ci/ci.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run CI script
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash ci/ci.sh
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out
          path: |
            ci-out/**
            build.log
          if-no-files-found: warn
      - name: Publish logs to ci-logs branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/collect-logs.sh
