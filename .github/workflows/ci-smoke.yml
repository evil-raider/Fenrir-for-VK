name: CI Smoke Test

on:
  push:
    branches: [ "ci/github-actions" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Configure app_fenrir (no compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -x
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Gradle configure (smoke)
        id: gradle
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app_fenrir:tasks --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Log tail to job summary
        if: always()
        run: |
          echo "## Gradle smoke outcome: ${{ steps.gradle.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish log to ci-logs branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOGSRC="$GITHUB_WORKSPACE/build.log"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/ci-logs
          if git clone --depth 1 --branch ci-logs "$REPO_URL" /tmp/ci-logs 2>/dev/null; then
            echo "cloned existing ci-logs"
          else
            git clone --depth 1 "$REPO_URL" /tmp/ci-logs
            cd /tmp/ci-logs
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p /tmp/ci-logs/runs
          cp "$LOGSRC" "/tmp/ci-logs/runs/${GITHUB_RUN_ID}-app_fenrir-tasks.log" 2>/dev/null || echo "no log to copy"
          cd /tmp/ci-logs
          git add -A
          git commit -m "ci-logs: run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git push "$REPO_URL" HEAD:ci-logs
